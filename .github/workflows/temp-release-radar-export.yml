name: Temporary Release Radar Research Export

on:
  push:
    paths:
      - '.github/workflows/temp-release-radar-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download research exports
        env:
          HISTORICAL_EXPORT_URL: "https://lwbmvnfirzseuipdzolx.supabase.co/functions/v1/historical-backfill-research?download=Fru9rhti6GCNEtFV3Ep60KUeutKTQZNjgdgc8eFZtkc"
          AWARDS_EXPORT_URL: "https://lwbmvnfirzseuipdzolx.supabase.co/functions/v1/historical-backfill-awards-export"
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location "$HISTORICAL_EXPORT_URL" \
            --output release-radar-historical-all.ndjson
          curl --fail --show-error --silent --location "$AWARDS_EXPORT_URL" \
            --output release-radar-award-signals.ndjson
          test -s release-radar-historical-all.ndjson
          test -s release-radar-award-signals.ndjson

      - name: Classify candidate films with IMDb title basics
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            https://datasets.imdbws.com/title.basics.tsv.gz \
            --output title.basics.tsv.gz
          python - <<'PY'
          import gzip
          import json

          wanted = set()
          with open('release-radar-historical-all.ndjson', encoding='utf-8') as source:
              for line in source:
                  row = json.loads(line)
                  if row.get('kind') not in {'base', 'supplement'}:
                      continue
                  for movie in (row.get('payload') or {}).get('movies', []):
                      imdb_id = movie.get('imdb_id')
                      if imdb_id:
                          wanted.add(imdb_id)

          found = {}
          with gzip.open('title.basics.tsv.gz', mode='rt', encoding='utf-8', errors='replace') as source:
              header = next(source).rstrip('\n').split('\t')
              for line in source:
                  fields = line.rstrip('\n').split('\t')
                  if not fields or fields[0] not in wanted:
                      continue
                  row = dict(zip(header, fields))
                  found[fields[0]] = {
                      'title_type': row.get('titleType'),
                      'primary_title': row.get('primaryTitle'),
                      'original_title': row.get('originalTitle'),
                      'start_year': None if row.get('startYear') == r'\N' else row.get('startYear'),
                      'runtime_minutes': None if row.get('runtimeMinutes') == r'\N' else row.get('runtimeMinutes'),
                      'genres': [] if row.get('genres') in {None, r'\N'} else row.get('genres').split(','),
                  }
                  if len(found) == len(wanted):
                      break

          with open('imdb-candidate-types.json', 'w', encoding='utf-8') as target:
              json.dump({
                  'source': 'https://datasets.imdbws.com/title.basics.tsv.gz',
                  'requested_ids': len(wanted),
                  'matched_ids': len(found),
                  'titles': found,
              }, target, ensure_ascii=False, indent=2)
          print(f'IMDb IDs requested: {len(wanted)}; matched: {len(found)}')
          PY
          test -s imdb-candidate-types.json

      - name: Upload final research inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-radar-research-inputs-final
          path: |
            release-radar-historical-all.ndjson
            release-radar-award-signals.ndjson
            imdb-candidate-types.json
          if-no-files-found: error
          retention-days: 1

# Temporary one-run bridge; final export includes IMDb title-type validation.
