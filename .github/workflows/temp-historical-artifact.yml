name: Temporary historical artifact
on:
  push:
    paths:
      - '.github/workflows/temp-historical-artifact.yml'
permissions:
  contents: write
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct validated ZIP
        run: |
          cat transfer/release-radar-historical-backfill-1950-2025.zip.b64.part-* | base64 -d > release-radar-historical-backfill-1950-2025.zip
          test "$(stat -c%s release-radar-historical-backfill-1950-2025.zip)" -eq 602828
          echo 'dbe82c43c3e3f487d5efdd5815036602cfb5587d2c07ed46d72f2cbf90d1c930  release-radar-historical-backfill-1950-2025.zip' | sha256sum -c -
          unzip -t release-radar-historical-backfill-1950-2025.zip
      - name: Upload validated ZIP
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-radar-historical-backfill-1950-2025
          path: release-radar-historical-backfill-1950-2025.zip
          if-no-files-found: error
          compression-level: 0
      - name: Publish artifact locator
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '{"artifact_id":%s,"run_id":%s,"zip_bytes":602828,"zip_sha256":"dbe82c43c3e3f487d5efdd5815036602cfb5587d2c07ed46d72f2cbf90d1c930"}\n' "$ARTIFACT_ID" "$RUN_ID" > transfer/historical-artifact-locator.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/historical-artifact-locator.json
          git commit -m 'Temporary historical backfill artifact locator'
          git push
