name: Temporary historical export
on:
  push:
    paths:
      - '.github/workflows/temp-historical-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and package 1950-2025 historical backfill
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3Ym12bmZpcnpzZXVpcGR6b2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjEyODUsImV4cCI6MjA4OTE5NzI4NX0.-bhEY2b8J-nAscNNmevf93g1NtQAhyESTnJPQ4Mdyug
        run: |
          python - <<'PY'
          import base64, csv, hashlib, json, os, shutil, urllib.request, zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, timedelta
          from pathlib import Path

          YEARS = list(range(1950, 2026))
          ENDPOINT = 'https://lwbmvnfirzseuipdzolx.supabase.co/functions/v1/historical-backfill-package-year'
          KEY = os.environ['SUPABASE_ANON_KEY']
          ROOT = Path('release-radar-historical-backfill-1950-2025')
          if ROOT.exists(): shutil.rmtree(ROOT)
          (ROOT / 'years').mkdir(parents=True)

          def fetch_year(year):
              req = urllib.request.Request(f'{ENDPOINT}?year={year}', headers={'Authorization': f'Bearer {KEY}', 'apikey': KEY, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  payload = json.loads(r.read().decode('utf-8'))
              if payload.get('year') != year or payload.get('counts') != {'movies': 20, 'tv_seasons': 10}:
                  raise RuntimeError(f'Bad payload for {year}: {payload.get("counts")} {payload.get("error")}')
              return payload

          rows = {}
          with ThreadPoolExecutor(max_workers=6) as ex:
              futs = {ex.submit(fetch_year, y): y for y in YEARS}
              for fut in as_completed(futs):
                  y = futs[fut]
                  rows[y] = fut.result()
                  print('completed', y, flush=True)

          if sorted(rows) != YEARS:
              raise RuntimeError('Missing years')

          def week_fields(ds):
              d = date.fromisoformat(ds)
              iso = d.isocalendar()
              monday = d - timedelta(days=d.weekday())
              return iso.year, iso.week, monday.isoformat()

          movie_ids = set(); tv_season_ids = set(); tv_keys = set(); movies_flat = []; tv_flat = []
          dup_movies=[]; dup_tv_seasons=[]; dup_tv_keys=[]
          for y in YEARS:
              p = rows[y]
              for m in p['movies']:
                  iy, iw, mon = week_fields(m['release_date'])
                  m['iso_week_year']=iy; m['iso_week']=iw; m['week_start_monday']=mon
                  m['year']=y
                  mid=int(m['tmdb_id'])
                  if mid in movie_ids: dup_movies.append((y,mid,m.get('title')))
                  movie_ids.add(mid); movies_flat.append(m)
              for t in p['tv_seasons']:
                  iy, iw, mon = week_fields(t['premiere_date'])
                  t['iso_week_year']=iy; t['iso_week']=iw; t['week_start_monday']=mon
                  t['year']=y
                  sid=int(t['tmdb_season_id']); key=f"{int(t['tmdb_series_id'])}:{int(t['season_number'])}"
                  if sid in tv_season_ids: dup_tv_seasons.append((y,sid,t.get('series_title')))
                  if key in tv_keys: dup_tv_keys.append((y,key,t.get('series_title')))
                  tv_season_ids.add(sid); tv_keys.add(key); tv_flat.append(t)

          assert len(movies_flat)==1520, len(movies_flat)
          assert len(tv_flat)==760, len(tv_flat)
          assert not dup_movies, dup_movies[:10]
          assert not dup_tv_seasons, dup_tv_seasons[:10]
          assert not dup_tv_keys, dup_tv_keys[:10]
          assert all(str(m['release_date']).startswith(str(m['year'])) for m in movies_flat)
          assert all(str(t['premiere_date']).startswith(str(t['year'])) for t in tv_flat)
          assert all(int(t['season_number']) > 0 for t in tv_flat)

          def esc(v): return str(v if v is not None else '').replace('|','\\|').replace('\n',' ')
          def reasons(x): return '; '.join(x.get('selection_reasons') or [])
          def movie_signal(m):
              a=m.get('award_signal') or {}
              bits=[]
              if a.get('best_picture_winner'): bits.append('Best Picture winner')
              elif a.get('best_picture_nominee'): bits.append('Best Picture nominee')
              if a.get('oscar_nominations'): bits.append(f"{a.get('oscar_nominations')} Oscar noms")
              if a.get('oscar_wins'): bits.append(f"{a.get('oscar_wins')} Oscar wins")
              dr=m.get('discovery_ranks') or {}
              if dr.get('revenue'): bits.append(f"revenue rank #{dr.get('revenue')}")
              return '; '.join(bits) or reasons(m)
          def tv_signal(t):
              a=t.get('award_signal') or {}
              bits=[]
              if a.get('major_wins'): bits.append(f"{a.get('major_wins')} major Emmy win signal")
              elif a.get('major_nominations'): bits.append(f"{a.get('major_nominations')} major Emmy nomination signal")
              if a.get('emmy_nominations'): bits.append(f"{a.get('emmy_nominations')} Emmy signal rows")
              return '; '.join(bits) or reasons(t)

          master=[]
          master += ['# Release Radar Historical Backfill — 1950–2025','',
                     'Curated historical release dataset for the Previous view. Each year contains 20 movies and 10 television seasons, linked to TMDb.','',
                     '**Scope:** 76 years · 1,520 movies · 760 TV seasons · 2,280 total release records.','']
          index=['# Historical Backfill Index','', 'Each yearly file contains the final 20 movies and 10 TV seasons selected for that premiere year.','']
          for y in YEARS:
              p=rows[y]
              lines=[f'# {y} — Historical Releases','', '## Movies','', '| # | Movie | Release | Week | TMDb | Signal |','|---:|---|---|---|---:|---|']
              for m in p['movies']:
                  lines.append(f"| {m['rank']} | {esc(m.get('title'))} | {m['release_date']} | {m['iso_week_year']}-W{m['iso_week']:02d} | {m['tmdb_id']} | {esc(movie_signal(m))} |")
              lines += ['', '## Television seasons','', '| # | Series / season | Premiere | Week | TMDb series | TMDb season | Signal |','|---:|---|---|---|---:|---:|---|']
              for t in p['tv_seasons']:
                  label=f"{t.get('series_title')} — Season {t.get('season_number')}"
                  lines.append(f"| {t['rank']} | {esc(label)} | {t['premiere_date']} | {t['iso_week_year']}-W{t['iso_week']:02d} | {t['tmdb_series_id']} | {t['tmdb_season_id']} | {esc(tv_signal(t))} |")
              lines += ['', '### Import keys','', '- Movies use `movie-{tmdb_id}`.', '- TV Season 1 uses `tv-{tmdb_series_id}`; returning seasons use `tv-{tmdb_series_id}-s{season_number}`.', '']
              text='\n'.join(lines)
              (ROOT/'years'/f'{y}.md').write_text(text, encoding='utf-8')
              index.append(f'- [{y}](years/{y}.md)')
              master += ['', '---', '', text]

          (ROOT/'INDEX.md').write_text('\n'.join(index)+'\n', encoding='utf-8')
          (ROOT/'release-radar-historical-backfill-1950-2025.md').write_text('\n'.join(master)+'\n', encoding='utf-8')

          methodology='''# Methodology\n\n## Movies\nEach year protects valid Best Picture nominees/winners whose canonical TMDb release year matches the target year, then deliberately balances those awards titles with major commercial and audience titles from the retained TMDb candidate pool. Remaining slots are ranked using Oscar strength, reported revenue rank, audience engagement, popularity, rating, and the original research editorial score. Rereleases whose canonical release year differs from the target year are excluded.\n\n## Television\nSelection is season-level, not series-level. Emmy-backed season candidates are merged with the broader annual TMDb season pool, deduplicated by TMDb series ID + season number, and balanced between awards signal and audience/popularity signal. Specials/Season 0 and award/event telecasts are excluded.\n\n## Dates\nThe stored movie release date and TV season premiere date determine the historical year and ISO week placement. `week_start_monday` is included for direct grouping in Release Radar's Previous view.\n\n## TMDb identifiers\nMovies include `tmdb_id`. TV includes both `tmdb_series_id` and `tmdb_season_id`, plus `season_number` and the Release Radar deterministic ID.\n'''
          (ROOT/'METHODOLOGY.md').write_text(methodology, encoding='utf-8')

          validation=f'''# Validation Report\n\n- Years: **76** (1950–2025 inclusive)\n- Movies: **{len(movies_flat):,}** (20 every year)\n- TV seasons: **{len(tv_flat):,}** (10 every year)\n- Total records: **{len(movies_flat)+len(tv_flat):,}**\n- Duplicate movie TMDb IDs across years: **0**\n- Duplicate TMDb season IDs across years: **0**\n- Duplicate TV series/season combinations across years: **0**\n- Movie release-year mismatches: **0**\n- TV premiere-year mismatches: **0**\n- Season 0 selections: **0**\n\nThe archive generator fails rather than publishing if any of these assertions are violated.\n'''
          (ROOT/'VALIDATION.md').write_text(validation, encoding='utf-8')
          (ROOT/'IMPORT_NOTES.md').write_text('''# Release Radar Import Notes\n\nUse `release_date` / `premiere_date` plus `week_start_monday` to place records into Previous.\n\nMovie ID: `movie-{tmdb_id}`\n\nTV ID: Season 1 → `tv-{tmdb_series_id}`; Season 2+ → `tv-{tmdb_series_id}-s{season_number}`.\n\nThe JSON export preserves all ranking metadata and research signals. The CSVs provide flatter import-friendly representations.\n''', encoding='utf-8')

          export={'metadata':{'range':[1950,2025],'year_count':76,'movie_count':1520,'tv_season_count':760,'total_count':2280,'methodology_version':'balanced-v2'},'years':[rows[y] for y in YEARS]}
          (ROOT/'release-radar-historical-backfill-1950-2025.json').write_text(json.dumps(export, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          movie_fields=['year','rank','title','original_title','release_date','iso_week_year','iso_week','week_start_monday','tmdb_id','imdb_id','tmdb_url','vote_average','vote_count','popularity','revenue_usd','budget_usd','final_score','signals','selection_reasons']
          with (ROOT/'release-radar-historical-movies-1950-2025.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=movie_fields);w.writeheader()
              for m in movies_flat:
                  w.writerow({k:(movie_signal(m) if k=='signals' else reasons(m) if k=='selection_reasons' else m.get(k)) for k in movie_fields})
          tv_fields=['year','rank','series_title','original_series_title','season_name','season_number','premiere_date','iso_week_year','iso_week','week_start_monday','tmdb_series_id','tmdb_season_id','release_radar_id','network','vote_average','series_vote_count','popularity','final_score','signals','selection_reasons']
          with (ROOT/'release-radar-historical-tv-seasons-1950-2025.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=tv_fields);w.writeheader()
              for t in tv_flat:
                  w.writerow({k:(tv_signal(t) if k=='signals' else reasons(t) if k=='selection_reasons' else t.get(k)) for k in tv_fields})

          zip_path=Path('release-radar-historical-backfill-1950-2025.zip')
          if zip_path.exists(): zip_path.unlink()
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p, p.as_posix())

          with zipfile.ZipFile(zip_path) as z:
              names=z.namelist()
              assert len([n for n in names if '/years/' in n and n.endswith('.md')])==76
              assert f'{ROOT.name}/INDEX.md' in names
              assert f'{ROOT.name}/release-radar-historical-backfill-1950-2025.json' in names
              assert all(z.getinfo(n).file_size>0 for n in names)
              bad=z.testzip(); assert bad is None, bad

          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          transfer=Path('transfer'); transfer.mkdir(exist_ok=True)
          raw=base64.b64encode(zip_path.read_bytes()).decode('ascii')
          for old in transfer.glob('release-radar-historical-backfill-1950-2025.zip.b64.part-*'): old.unlink()
          chunks=[raw[i:i+400000] for i in range(0,len(raw),400000)]
          for i,chunk in enumerate(chunks): (transfer/f'release-radar-historical-backfill-1950-2025.zip.b64.part-{i:03d}').write_text(chunk,encoding='ascii')
          manifest={'zip_bytes':zip_path.stat().st_size,'zip_sha256':sha,'base64_chars':len(raw),'parts':len(chunks),'archive_files':len(names),'yearly_markdown_files':76,'movies':1520,'tv_seasons':760}
          (transfer/'release-radar-historical-backfill-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit transfer chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/release-radar-historical-backfill-1950-2025.zip.b64.part-* transfer/release-radar-historical-backfill-manifest.json
          git commit -m 'Temporary packaged historical backfill transfer'
          git push
